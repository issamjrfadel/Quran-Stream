name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 @esbuild/darwin-arm64 @esbuild/darwin-x64 --no-save || true

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install || true

      - name: Build iOS App Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath derived_data \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          if [ -d "ios/App/derived_data/Build/Products/Release-iphoneos/App.app" ]; then
            cp -r ios/App/derived_data/Build/Products/Release-iphoneos/App.app Payload/
          elif [ -d "ios/App/build/Release-iphoneos/App.app" ]; then
            cp -r ios/App/build/Release-iphoneos/App.app Payload/
          fi
          zip -r QuranStream.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranStream-iOS-IPA
          path: QuranStream.ipa

