name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install || pod install --repo-update || true
          fi

      - name: Build iOS App Xcode Project
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -sdk iphoneos \
                       -configuration Release \
                       -derivedDataPath derived_data \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       AD_HOC_CODE_SIGNING_ALLOWED=YES \
                       COMPILER_INDEX_STORE_ENABLE=NO \
                       clean build
          elif [ -f "App.xcodeproj/project.pbxproj" ]; then
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -sdk iphoneos \
                       -configuration Release \
                       -derivedDataPath derived_data \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       AD_HOC_CODE_SIGNING_ALLOWED=YES \
                       COMPILER_INDEX_STORE_ENABLE=NO \
                       clean build
          else
            echo "Neither App.xcworkspace nor App.xcodeproj found in ios/App"
            exit 1
          fi

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App -name "App.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App.app at $APP_PATH"
            cp -r "$APP_PATH" Payload/
          else
            echo "Could not find App.app"
            exit 1
          fi
          zip -r QuranStream.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranStream-iOS-IPA
          path: QuranStream.ipa

